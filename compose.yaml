name: vysker
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: vysker
      POSTGRES_PASSWORD: vysker
      POSTGRES_DB: vysker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vysker -d vysker"]
      interval: 2s
      timeout: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    build:
      context: .
      target: runtime
    environment:
      OBEC_ADRESA: 0.0.0.0:3000
      OBEC_MIN_PASSWORD_LENGTH: ${OBEC_MIN_PASSWORD_LENGTH:-24}
      OBEC_DATABAZE: postgresql://vysker:vysker@postgres:5432/vysker
      OBEC_VEREJNA_URL: http://localhost:3000
      OBEC_UKAZKOVA_DATA: "false"
      OBEC_PRIVACY_CONFIG: /app/config/privacy.example.json
      OBEC_SMTP_HOST: mailpit
      OBEC_SMTP_PORT: "1025"
      OBEC_SMTP_TLS: none
      OBEC_EMAIL_OD: Vyskeř <noreply@vysker.test>
    volumes:
      - ./config/privacy.example.json:/app/config/privacy.example.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  tests:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://vysker:vysker@postgres:5432/postgres
      TEST_SMTP_HOST: mailpit
      TEST_SMTP_PORT: "1025"
    volumes:
      - cargo-registry:/usr/local/cargo/registry
      - test-target:/app/target
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
volumes:
  postgres-data:
  cargo-registry:
  test-target:
