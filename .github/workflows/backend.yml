name: Backend tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests and SMTP
        run: docker compose --profile test run --build --rm tests
      - name: Stop local services
        if: always()
        run: docker compose --profile test down

  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: vysker
          POSTGRES_PASSWORD: vysker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vysker"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://vysker:vysker@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        run: |
          docker compose --env-file deploy/.env.example -f compose.production.yaml config --quiet
          docker compose --env-file deploy/.env.example -f compose.production.yaml -f compose.google-mail.yaml config --quiet
      - name: Validate reverse proxy
        run: docker run --rm -e DOMAIN=localhost -e TLS_EMAIL=test@example.test -e ADMIN_NETWORKS=127.0.0.1/32 -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4 caddy validate --config /etc/caddy/Caddyfile
      - name: Build complete Leptos production image
        run: docker build -f Dockerfile.web -t vysker-web:test .
      - name: Check migration job in production image
        run: docker run --rm vysker-web:test python3 scripts/legacy_sync.py run --help
      - name: Smoke test production mode and static assets
        run: |
          docker run --rm --network host -e TEST_DATABASE_URL \
            -v "$PWD/scripts/smoke-web.py:/tmp/smoke-web.py:ro" \
            -v "$PWD/scripts/postgres.py:/tmp/postgres.py:ro" \
            -v "$PWD/config/privacy.example.json:/tmp/privacy.example.json:ro" \
            vysker-web:test python3 /tmp/smoke-web.py \
            --binary ./obecni-web --site-root target/site \
            --privacy-example /tmp/privacy.example.json
      - name: Build browser regression runner
        run: docker build -f Dockerfile.e2e -t vysker-e2e:test .
      - name: Browser workflows on isolated data
        run: docker run --name vysker-e2e --ipc=host --network host -e TEST_DATABASE_URL vysker-e2e:test
      - name: Collect browser report
        if: always()
        run: docker cp vysker-e2e:/app/target/playwright-report ./playwright-report || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: playwright-report
          if-no-files-found: ignore
