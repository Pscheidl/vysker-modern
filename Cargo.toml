[package]
name = "obecni-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "obecni-web"
path = "src/main.rs"
required-features = ["ssr"]

[[bin]]
name = "preview"
path = "src/preview.rs"
required-features = ["demo"]

[[bin]]
name = "obec-api"
path = "src/bin/api.rs"
required-features = ["ssr"]

[[bin]]
name = "obec-admin"
path = "src/bin/admin.rs"
required-features = ["ssr"]

[dependencies]
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "gif"] }
anyhow = { version = "1.0.104", optional = true }
axum = { version = "0.8.9", optional = true, features = ["multipart"] }
argon2 = { version = "0.5.3", optional = true }
rand = { version = "0.8.5", optional = true }
sha2 = { version = "0.10.9", optional = true }
lettre = { version = "0.11", optional = true, default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "pool"] }
time-tz = { version = "2", optional = true }
url = { version = "2", optional = true }
percent-encoding = { version = "2", optional = true }
rpassword = { version = "7", optional = true }
gloo-net = { version = "0.6", optional = true, default-features = false, features = ["http", "json"] }
leptos = "0.8"
leptos_axum = { version = "0.8", optional = true }
leptos_meta = "0.8"
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring", "migrate", "time", "derive", "macros"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde-human-readable"] }
tokio = { version = "1.53.1", optional = true, features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util", "sync"] }
tower-http = { version = "0.7.1", optional = true, features = ["trace", "fs"] }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true, features = ["env-filter"] }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Storage", "MediaQueryList", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "HtmlDialogElement", "BeforeUnloadEvent", "File", "FileList", "FormData", "RequestCredentials", "Location", "History"] }
console_error_panic_hook = { version = "0.1", optional = true }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[features]
default = ["ssr"]
ssr = ["dep:image", "dep:anyhow", "dep:axum", "dep:leptos_axum", "dep:sqlx", "dep:tokio", "dep:tower-http", "dep:tracing", "dep:tracing-subscriber", "dep:serde_json", "dep:argon2", "dep:rand", "dep:sha2", "dep:lettre", "dep:time-tz", "dep:url", "dep:percent-encoding", "dep:rpassword", "leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr"]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:console_error_panic_hook", "dep:gloo-net", "dep:serde_json", "dep:percent-encoding"]
demo = ["leptos/csr", "dep:serde_json", "dep:console_error_panic_hook"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.dev]
# Plné debug typy Leptosu překračují limit 4 GiB DWARF při linkování testů.
debug = 1

[profile.test]
debug = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
bin-target = "obecni-web"
output-name = "obecni-web"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
